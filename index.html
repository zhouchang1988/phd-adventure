<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>谢凡的奇幻冒险2.0</title>
    <link rel="icon" href="assets/icons/favicon.ico" type="image/x-icon">
    <link rel="stylesheet" href="css/main.css">
    <link rel="stylesheet" href="css/animations.css">
    <link rel="stylesheet" href="css/scenes.css">
    <link rel="stylesheet" href="css/characters.css">
    <link rel="stylesheet" href="css/effects.css">
</head>
<body>
    <!-- 游戏容器 -->
    <div id="game-container">
        <!-- 顶部状态栏 -->
        <header id="status-bar">
            <div class="status-left">
                <span id="chapter-indicator">序章</span>
                <span id="location-indicator">海边</span>
            </div>
            <div class="status-right">
                <button id="btn-save-manager" class="icon-btn" title="存档管理">💾</button>
                <button id="btn-settings" class="icon-btn" title="设置">⚙️</button>
            </div>
        </header>

        <!-- 主画面区域 -->
        <main id="main-stage">
            <!-- 背景层 -->
            <div id="background-layer"></div>
            
            <!-- 角色层 -->
            <div id="character-layer">
                <div id="character-left" class="character"></div>
                <div id="character-center" class="character"></div>
                <div id="character-right" class="character"></div>
            </div>
            
            <!-- 特效层 -->
            <div id="effects-layer"></div>
        </main>

        <!-- 对话框区域 -->
        <div id="dialogue-box">
            <div id="speaker-name"></div>
            <div id="dialogue-content">
                <span id="dialogue-text"></span>
                <span id="dialogue-cursor" class="blink">▼</span>
            </div>
        </div>

        <!-- 选项区域 -->
        <div id="choices-container"></div>

        <!-- 系统消息 -->
        <div id="system-message" class="hidden"></div>
    </div>

    <!-- 存档弹窗 -->
    <div id="save-modal" class="modal hidden">
        <div class="modal-content">
            <div class="modal-header">
                <h2>存档管理</h2>
                <button class="modal-close">&times;</button>
            </div>
            <div class="modal-body">
                <div class="save-manager-actions">
                    <button id="btn-new-game" class="save-action-btn new-game-btn">
                        <span class="action-icon">🌟</span>
                        <span class="action-text">新的故事</span>
                        <span class="action-desc">开始全新的冒险</span>
                    </button>
                    <button id="btn-save-current" class="save-action-btn save-btn">
                        <span class="action-icon">💾</span>
                        <span class="action-text">保存当下</span>
                        <span class="action-desc">记录当前进度</span>
                    </button>
                    <button id="btn-load-memory" class="save-action-btn load-btn">
                        <span class="action-icon">📖</span>
                        <span class="action-text">旧的回忆</span>
                        <span class="action-desc">读取过往存档</span>
                    </button>
                </div>
                <div id="save-slots" class="save-slots-container"></div>
            </div>
        </div>
    </div>

    <!-- 设置弹窗 -->
    <div id="settings-modal" class="modal hidden">
        <div class="modal-content">
            <div class="modal-header">
                <h2>设置</h2>
                <button class="modal-close">&times;</button>
            </div>
            <div class="modal-body">
                <div class="setting-item">
                    <label>文字速度</label>
                    <input type="range" id="text-speed" min="10" max="100" value="50">
                </div>
                <div class="setting-item">
                    <label>音量</label>
                    <input type="range" id="volume" min="0" max="100" value="70">
                </div>
            </div>
        </div>
    </div>

    <!-- 成就弹窗 -->
    <div id="achievement-popup" class="hidden">
        <div class="achievement-icon">🏆</div>
        <div class="achievement-info">
            <div class="achievement-title"></div>
            <div class="achievement-desc"></div>
        </div>
    </div>

    <!-- 加载脚本 -->
    <script src="js/story.js"></script>
    <script src="js/save.js"></script>
    <script src="js/engine.js"></script>
    <script src="js/app.js"></script>
</body>
</html>
